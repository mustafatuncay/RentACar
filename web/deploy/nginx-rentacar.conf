# nginx site ayarı: /etc/nginx/sites-available/rentacar olarak kopyalayın,
# 'rentacar.example.com' yerine kendi alan adınızı yazın, sonra:
#   sudo ln -s /etc/nginx/sites-available/rentacar /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d rentacar.example.com      (ücretsiz HTTPS sertifikası)
#   sudo nginx -t && sudo systemctl reload nginx
# PWA yalnızca HTTPS üzerinde yüklenebilir.

server {
    listen 80;
    server_name rentacar.example.com;

    client_max_body_size 2m;

    # Service worker her zaman güncel gelsin
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache";
    }

    # Sürüm numaralı dosyalar uzun süre önbellekte kalabilir
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
